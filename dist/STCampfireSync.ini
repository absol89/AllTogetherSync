; Install as Data/SKSE/Plugins/STCampfireSync.ini

[General]
; DirectInput scan code of the hotkey. 66 = F8. Other examples: 63 = F5, 64 = F6, 87 = F11.
HotkeyScanCode=66

; Form ID of the campfire to place, as a full runtime ID (load order prefix included). The default is the
; vanilla Skyrim.esm "Campfire01Burning".
CampfireBaseFormID=0x00035F49
